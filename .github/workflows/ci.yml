name: CI

# Paused: automatic runs are off while the owner's GitHub Actions is having
# problems. Run it by hand from the Actions tab, or run the same four commands
# locally. To switch automatic runs back on, restore the push and pull_request
# triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
